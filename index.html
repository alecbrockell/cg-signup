<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Church Group</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--text:#1c1c1a;--muted:#77756f;--line:#e6e4de;--accent:#2f5d50;--on-accent:#fff;--danger:#a33}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--text:#ecebe6;--muted:#9a988f;--line:#2e2e2b;--accent:#8fc4b2;--on-accent:#141413;--danger:#e88}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:22px;font-weight:600;margin:0 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.head{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 16px;color:inherit;font:inherit;cursor:pointer}
.cancelled .head{cursor:default;opacity:.5}
.date{font-weight:600}
.label{color:var(--muted);font-size:14px;margin-left:6px}
.sum{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
.ln{display:flex;justify-content:space-between;gap:12px}
.ln b{font-weight:500;color:var(--text);text-align:right}
.open{color:var(--accent)}
.body{border-top:1px solid var(--line);padding:2px 16px 16px}
.role{padding-top:14px}
.role h3{font-size:15px;font-weight:600;margin:0 0 4px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-size:15px}
.entry small{display:block;color:var(--muted);font-size:13px}
.edit{padding:6px 0}
input{display:block;width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);margin:6px 0}
.row{display:flex;gap:8px;margin-top:2px}
.btn{font:inherit;font-size:15px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.danger{color:var(--danger);margin-left:auto}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;padding:4px;cursor:pointer}
.err{color:var(--danger);font-size:14px;margin:4px 0}
.msg{color:var(--muted);text-align:center;padding:40px 0}
button:disabled{opacity:.5}
</style>
</head>
<body>
<main>
<h1>Church Group - Fall 2026</h1>
<p class="sub">Tap a date to sign up.</p>
<div id="list"><p class="msg">Loading…</p></div>
</main>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzVtzE7RPatulw4N5Jcamuwh1XJ20lmsdJ8_9eNvdIrryJremNP3s6rLPh_qxvOQBg0rA/exec';
const TITLE = 'Church Group - Fall 2026';

let data = [], openDate = null, editing = null, busy = false, errors = {}, drafts = {};
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let tokens = store.get('tokens', {});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const draft = (k, d) => (k in drafts ? drafts[k] : d);
const dis = () => (busy ? 'disabled' : '');

function fmt(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

const today = new Date().toLocaleDateString('en-CA');

function setData(dates) {
  data = dates.filter(d => d.date >= today);
  store.set('data', data);
}

async function load() {
  try {
    const res = await fetch(API_URL);
    setData((await res.json()).dates);
    if (document.activeElement?.tagName !== 'INPUT') render();
  } catch {
    if (!data.length) document.getElementById('list').innerHTML = '<p class="msg">Couldn’t load the schedule. Refresh to try again.</p>';
  }
}

async function send(payload, errKey) {
  busy = true; errors = {}; render();
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    setData(json.dates);
    return json;
  } catch (e) {
    errors[errKey] = e.message || 'Something went wrong. Try again.';
    return null;
  } finally {
    busy = false;
    render();
  }
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = data.length ? data.map(card).join('') : '<p class="msg">No upcoming dates.</p>';
}

function card(d) {
  const label = d.label && d.label !== TITLE ? `<span class="label">${esc(d.label)}</span>` : '';
  const note = d.note ? `<span class="ln"><span>${esc(d.note)}</span></span>` : '';
  const sum = d.cancelled
    ? `<span class="ln"><span>No meeting${d.note ? ' · ' + esc(d.note) : ''}</span></span>`
    : d.roles.map(r => {
        const names = r.signups.map(s => esc(s.name)).join(', ');
        return `<span class="ln"><span>${esc(r.name)}</span>${names ? `<b>${names}</b>` : '<span class="open">Open</span>'}</span>`;
      }).join('') + note;
  const head = `<span class="date">${fmt(d.date)}</span>${label}<span class="sum">${sum}</span>`;
  if (d.cancelled) return `<div class="card cancelled"><div class="head">${head}</div></div>`;
  const body = openDate === d.date ? `<div class="body">${d.roles.map(r => role(d, r)).join('')}</div>` : '';
  return `<div class="card"><button class="head" data-act="toggle" data-date="${d.date}">${head}</button>${body}</div>`;
}

function role(d, r) {
  const k = d.date + '|' + r.key;
  const full = r.max && r.signups.length >= r.max;
  const attrs = `data-date="${d.date}" data-role="${esc(r.key)}"`;
  const form = full ? '' : `
    <input data-draft="n-${esc(k)}" value="${esc(draft('n-' + k, ''))}" placeholder="Your name">
    ${r.detail ? `<input data-draft="x-${esc(k)}" value="${esc(draft('x-' + k, ''))}" placeholder="${esc(r.detail)} (Optional)">` : ''}
    <button class="btn primary" data-act="add" ${attrs} ${dis()}>${busy ? 'Saving…' : 'Sign up'}</button>`;
  return `<div class="role"><h3>${esc(r.name)}</h3>
    ${r.signups.map(s => entry(r, s)).join('')}
    ${errors[k] ? `<p class="err">${esc(errors[k])}</p>` : ''}${form}</div>`;
}

function entry(r, s) {
  if (editing === s.id) {
    return `<div class="edit">
      <input data-draft="en-${esc(s.id)}" value="${esc(draft('en-' + s.id, s.name))}" placeholder="Your name">
      ${r.detail ? `<input data-draft="ex-${esc(s.id)}" value="${esc(draft('ex-' + s.id, s.detail))}" placeholder="${esc(r.detail)} (Optional)">` : ''}
      ${errors['e-' + s.id] ? `<p class="err">${esc(errors['e-' + s.id])}</p>` : ''}
      <div class="row">
        <button class="btn primary" data-act="save" data-id="${esc(s.id)}" ${dis()}>Save</button>
        <button class="btn" data-act="cancel" ${dis()}>Cancel</button>
        <button class="btn danger" data-act="remove" data-id="${esc(s.id)}" ${dis()}>Remove</button>
      </div></div>`;
  }
  const edit = s.id ? `<button class="link" data-act="edit" data-id="${esc(s.id)}">Edit</button>` : '';
  return `<div class="entry"><div>${esc(s.name)}${s.detail ? `<small>${esc(s.detail)}</small>` : ''}</div>${edit}</div>`;
}

document.addEventListener('input', e => {
  const k = e.target.dataset.draft;
  if (k) drafts[k] = e.target.value;
});

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el || busy) return;
  const { act, date, role, id } = el.dataset;

  if (act === 'toggle') { openDate = openDate === date ? null : date; editing = null; errors = {}; render(); }
  if (act === 'edit') { editing = id; errors = {}; render(); }
  if (act === 'cancel') { editing = null; errors = {}; render(); }

  if (act === 'add') {
    const k = date + '|' + role;
    const name = draft('n-' + k, '').trim();
    if (!name) { errors = { [k]: 'Enter your name.' }; render(); return; }
    const res = await send({ action: 'add', date, role, name, detail: draft('x-' + k, '').trim() }, k);
    if (res) {
      tokens[res.id] = res.token;
      store.set('tokens', tokens);
      delete drafts['n-' + k]; delete drafts['x-' + k];
      render();
    }
  }

  if (act === 'save') {
    const sig = data.flatMap(d => d.roles.flatMap(r => r.signups)).find(s => s.id === id) || { name: '', detail: '' };
    const name = draft('en-' + id, sig.name).trim();
    if (!name) { errors = { ['e-' + id]: 'Enter your name.' }; render(); return; }
    const res = await send({ action: 'update', id, token: tokens[id], name, detail: draft('ex-' + id, sig.detail).trim() }, 'e-' + id);
    if (res) { editing = null; delete drafts['en-' + id]; delete drafts['ex-' + id]; render(); }
  }

  if (act === 'remove') {
    if (!confirm('Remove this sign-up?')) return;
    const res = await send({ action: 'remove', id, token: tokens[id] }, 'e-' + id);
    if (res) { editing = null; delete tokens[id]; store.set('tokens', tokens); render(); }
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !busy && !editing) load();
});

const cached = store.get('data', null);
if (cached) { data = cached.filter(d => d.date >= today); render(); }
load();
</script>
</body>
</html>
